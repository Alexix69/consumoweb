
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>

<body>
	<div layout:fragment="contenidopaginas" class="container-fluid">
		<table class="table">
			<thead>
				<tr>
					<th scope="col">#Código Grupo</th>
					<th scope="col">Nombre</th>
					<th scope="col">Descripción</th>
					<th scope="col">Estado</th>
					<th scope="col"></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="grupo : ${listagrupos}">
					<td th:text="${grupo.idGrupo}"></td>
					<td th:text="${grupo.nombre}"></td>
					<td th:text="${grupo.descripcion}"></td>
					<td th:text="${grupo.estadoRegistro}"></td>
					<td><a href=" " class="btn btn-primary" title="Editar"><i
							class="ti-pencil-alt"></i></a> <a href=" " class="btn btn-danger"
						title="Eliminar"><i class="ti-trash"></i></a></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>

</html>
